<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
    <title>H5GG 加载器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
        body{background:transparent;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
        #app{width:650px;height:100vh;max-height:100vh;background:#1a1a2e;border-radius:12px;border:1px solid #4a4a6a;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6);display:flex;flex-direction:column;position:relative}
        .header{background:#4361ee;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;height:40px;flex-shrink:0}
        .header-title{color:#fff;font-size:15px;font-weight:bold}
        .header-close{background:rgba(255,255,255,0.15);border:none;border-radius:50%;color:#fff;width:24px;height:24px;font-size:14px;cursor:pointer}
        .menu-bar{display:flex;background:#252540;border-bottom:1px solid #4a4a6a;flex-shrink:0}
        .menu-item{padding:10px 20px;color:#888;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
        .menu-item.active{color:#fff;border-bottom-color:#4361ee}
        .content{flex:1;overflow:hidden;position:relative;background:#1a1a2e}
        .tab-page{display:none;width:100%;height:100%}
        .tab-page.active{display:block}
        .home-content{padding:16px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .device-card{background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;margin-bottom:16px;border:1px solid #333}
        .device-card .label{color:#888;font-size:11px;margin-top:6px}
        .device-card .label:first-child{margin-top:0}
        .device-card .status{font-size:12px;margin-top:4px;padding:6px 10px;border-radius:4px}
        .device-card .status.active{color:#90EE90;background:rgba(46,204,113,0.1)}
        .device-card .status.inactive{color:#ff6b6b;background:rgba(255,107,107,0.1)}
        .device-card .status.waiting{color:#f1c40f;background:rgba(241,196,15,0.1)}
        .device-card .status.info{color:#64b5f6;background:rgba(100,181,246,0.1)}
        .device-card .status.revoked{color:#ff6b6b;background:rgba(255,107,107,0.2);border:1px solid #ff6b6b}
        .device-card .device-info-box{background:rgba(255,255,255,0.03);border-radius:6px;padding:10px;margin:8px 0;border:1px solid #2a2a4a;word-break:break-all}
        .device-card .device-info-box .di-label{color:#666;font-size:10px}
        .device-card .device-info-box .di-value{color:#90EE90;font-family:monospace;font-size:12px;margin-top:2px}
        .device-card .device-info-box .di-value.fingerprint{color:#bb86fc;font-size:13px;font-weight:bold}
        .device-card .info-tip{color:#444;font-size:9px;margin-top:4px}
        .plugin-card{background:rgba(255,255,255,0.05);border:1px solid #4a4a6a;border-radius:8px;padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .3s}
        .plugin-card:hover{background:rgba(67,97,238,0.15);border-color:#4361ee}
        .plugin-card .info h3{color:#fff;font-size:15px;margin-bottom:4px}
        .plugin-card .info p{color:#888;font-size:12px}
        .plugin-card .btn-load{border:none;padding:8px 20px;border-radius:20px;font-size:13px;cursor:pointer;color:#fff;background:#4361ee;transition:all .3s}
        .plugin-card .btn-load.loaded{background:#2ecc71}
        .plugin-card .btn-load:disabled{opacity:0.5;cursor:not-allowed}
        .auth-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:100;border-radius:12px}
        .auth-overlay.show{display:flex}
        .auth-box{background:#2a2a40;padding:30px;border-radius:12px;border:1px solid #4a4a6a;max-width:400px;width:90%;text-align:center}
        .auth-box h2{color:#90EE90;font-size:18px;margin-bottom:6px}
        .auth-box .sub{color:#888;font-size:12px;margin-bottom:10px}
        .auth-box .device-info{background:rgba(255,255,255,0.05);border-radius:6px;padding:8px;margin:8px 0;font-size:11px;color:#666;word-break:break-all}
        .auth-box .device-info span{color:#bb86fc;font-family:monospace;font-size:11px;font-weight:bold}
        .auth-box .input-group{margin:8px 0}
        .auth-box input{width:100%;padding:10px;border-radius:8px;border:1px solid #4a4a6a;background:#111;color:#fff;font-size:13px;margin-bottom:8px;text-align:center;letter-spacing:0.5px;font-family:monospace}
        .auth-box input:focus{border-color:#4361ee;outline:none}
        .auth-box .auth-error{color:#ff6b6b;font-size:13px;margin-top:8px;display:none}
        .auth-box .auth-btn{width:100%;padding:10px;border:none;border-radius:8px;background:#90EE90;color:#000;font-weight:bold;font-size:15px;cursor:pointer;transition:opacity .2s}
        .auth-box .auth-btn:disabled{opacity:0.5;cursor:not-allowed}
        .auth-box .hint{font-size:10px;color:#444;margin-top:10px}
        .back-btn{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:8px 16px;position:absolute;top:0;left:0;z-index:20}
        .back-btn.show{display:block}
        #page-plugin{position:relative}
        #webview-container{width:100%;height:100%}
        #loading-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:999;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;border-radius:12px}
        #loading-overlay.show{display:flex}
        #loading-overlay .spinner{width:44px;height:44px;border:4px solid #333;border-top-color:#4361ee;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:18px}
        @keyframes spin{to{transform:rotate(360deg)}}
        #loading-overlay .load-title{color:#fff;font-size:15px;margin-bottom:8px;font-weight:bold}
        #loading-overlay .load-status{color:#90EE90;font-size:13px;margin-bottom:16px}
        #loading-overlay .load-bar-wrap{width:220px;height:6px;background:#2a2a4a;border-radius:3px;overflow:hidden;margin-bottom:10px}
        #loading-overlay .load-bar{height:100%;width:0%;background:linear-gradient(90deg,#4361ee,#90EE90);border-radius:3px;transition:width .3s ease}
        #loading-overlay .load-percent{color:#888;font-size:12px;font-family:monospace}
        #loading-overlay .load-tip{color:#555;font-size:10px;margin-top:14px}
        .copyright-notice{margin-top:16px;padding:14px 16px;background:rgba(255,200,0,0.06);border-radius:8px;border-left:3px solid #ffcc00}
        .copyright-notice p{color:#ffcc00;font-size:12px;line-height:1.8;margin:0}
        .copyright-notice .small-text{color:#888;font-size:11px}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-thumb{background:#4361ee;border-radius:2px}
        @media(max-width:650px){#app{width:100%;border-radius:0;border:none}.auth-overlay{border-radius:0}#loading-overlay{border-radius:0}}
        .copy-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#90EE90;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;border:1px solid #4a4a6a;display:none;text-align:center;max-width:80%;word-break:break-all}
        .copy-toast.show{display:block;animation:fadeInUp .3s ease}
        @keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .progress-bar{width:100%;height:3px;background:#2a2a4a;position:relative;overflow:hidden;flex-shrink:0}
        .progress-bar .fill{height:100%;background:linear-gradient(90deg,#4361ee,#90EE90);width:0%;transition:width .3s}
    </style>
</head>

<div id="app">

    <div class="copy-toast" id="copyToast">📋 已复制</div>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="load-title">正在启动插件</div>
        <div class="load-status" id="loadStatus">连接服务器中...</div>
        <div class="load-bar-wrap"><div class="load-bar" id="loadBar"></div></div>
        <div class="load-percent" id="loadPercent">0%</div>
        <div class="load-tip">首次加载稍慢，请耐心等待</div>
    </div>

    <div class="header">
        <span class="header-title">释意插件 加载器</span>
        <button class="header-close" id="closeBtn">✕</button>
    </div>

    <div class="menu-bar">
        <div class="menu-item active" data-tab="home">首页</div>
        <div class="menu-item" data-tab="plugin">插件</div>
    </div>

    <div class="content">
        <div class="tab-page active" id="page-home">
            <div class="home-content">
                <div class="device-card">
                    <div id="udidBindArea">
                        <div class="label">📱 设备信息</div>
                        <div class="device-info-box">
                            <div class="di-label">🔑 设备标识</div>
                            <div class="di-value fingerprint" id="udidValue">生成中...</div>
                            <div class="info-tip" id="statusTip">● 正在识别设备</div>
                        </div>
                        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="bind-btn" id="refreshBtn" style="background:#2ecc71;color:#000;">🔄 刷新</button>
                            <button class="bind-btn" id="copyBtn" style="background:#f39c12;color:#000;">📋 复制</button>
                        </div>
                        <div class="udid-display" id="udidDisplay"></div>
                        <div class="bound-status" id="boundStatus">✅ 已绑定</div>
                        <div class="unbind-area" id="unbindArea" style="display:none;">
                            <button class="unbind-btn" id="unbindBtn">⚠️ 重置</button>
                        </div>
                    </div>
                    <div class="label" style="margin-top:12px;">📊 状态</div>
                    <div class="status waiting" id="statusDisplay">⏳ 初始化中...</div>
                </div>

                <div class="plugin-card" id="pluginCard">
                    <div class="info">
                        <h3>2K 释意插件</h3>
                        <p id="pluginDesc">NBA 2K 游戏辅助工具</p>
                    </div>
                    <button class="btn-load" id="actionBtn" disabled>初始化中</button>
                </div>

                <div class="copyright-notice">
                    <p>⚠️ 此插件由 <strong style="color:#fff;">2K美式释意</strong> 本人制作<br>
                    购买请关注公众号 <strong style="color:#fff;">「2k释意」</strong> 私信<br>
                    <span class="small-text">唯一正版渠道 · 谨防受骗</span></p>
                </div>
            </div>
        </div>

        <div class="tab-page" id="page-plugin">
            <button class="back-btn" id="backBtn">‹</button>
            <div id="webview-container"></div>
        </div>

        <div class="auth-overlay" id="authOverlay">
            <div class="auth-box">
                <h2>🔐 卡密验证</h2>
                <p class="sub">输入卡密激活</p>
                <div class="device-info">设备: <span id="authDeviceId">---</span></div>
                <div class="input-group">
                    <input type="text" id="authCardInput" placeholder="请输入卡密" maxlength="20">
                </div>
                <div class="auth-error" id="authError">卡密无效</div>
                <button class="auth-btn" id="authBtn">验证并激活</button>
                <div class="hint">一机一码 · 请勿共用</div>
            </div>
        </div>
    </div>
</div>
